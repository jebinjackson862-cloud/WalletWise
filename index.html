<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>WalletWise</title>

<link rel="stylesheet" href="style.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

<header>

<h1><i class="fa-solid fa-wallet"></i> WalletWise</h1>

<button id="themeBtn">

<i class="fa-solid fa-moon"></i>

</button>

</header>

<div class="balance">

<h3>Current Balance</h3>

<h1 id="balance">₹0</h1>

</div>

<div class="summary">

<div class="card income">

<h3>Income</h3>

<p id="income">₹0</p>

</div>

<div class="card expense">

<h3>Expense</h3>

<p id="expense">₹0</p>

</div>

</div>

<form id="form">

<select id="type">

<option value="income">Income</option>

<option value="expense">Expense</option>

</select>

<input
type="text"
id="desc"
placeholder="Description"
required>

<input
type="number"
id="amount"
placeholder="Amount"
required>

<select id="category">

<option>Salary</option>

<option>Food</option>

<option>Shopping</option>

<option>Transport</option>

<option>Bills</option>

</select>

<input
type="date"
id="date"
required>

<button>

<i class="fa-solid fa-plus"></i>

Add Transaction

</button>

</form>

<h2>Recent Transactions</h2>

<ul id="list"></ul>

</div>

<script src="script.js"></script>

</body>

</html>
