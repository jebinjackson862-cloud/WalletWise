<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WalletWise</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>💰 WalletWise</h1>

<div class="balance-card">
<h2>Current Balance</h2>
<h1 id="balance">₹0</h1>
</div>

<div class="cards">

<div class="income">
<h3>Income</h3>
<p id="income">₹0</p>
</div>

<div class="expense">
<h3>Expense</h3>
<p id="expense">₹0</p>
</div>

</div>

<h2>Add Transaction</h2>

<form id="form">

<select id="type">
<option value="income">Income</option>
<option value="expense">Expense</option>
</select>

<input
type="text"
id="desc"
placeholder="Description"
required>

<input
type="number"
id="amount"
placeholder="Amount"
required>

<select id="category">

<option>Salary</option>
<option>Food</option>
<option>Shopping</option>
<option>Transport</option>
<option>Bills</option>
<option>Entertainment</option>

</select>

<input
type="date"
id="date"
required>

<button>Add Transaction</button>

</form>

<h2>Transactions</h2>

<ul id="list"></ul>

</div>

<script src="script.js"></script>

</body>
</html>
